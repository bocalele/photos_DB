<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Annotations photo</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand" title="Annotations photo">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="3" y="3" width="12" height="12" rx="3" fill="#f1be4c"></rect>
        <rect x="17" y="3" width="12" height="12" rx="3" fill="#6cc070"></rect>
        <rect x="3" y="17" width="12" height="12" rx="3" fill="#7aa2f7"></rect>
        <rect x="17" y="17" width="12" height="12" rx="3" fill="#e07a5f"></rect>
      </svg>
      <span class="brand-name">Annotations</span>
    </div>

    <nav id="app-tabs" class="app-tabs" aria-label="Applications"></nav>

    <div class="bar-actions">
      <span id="directory-path" class="directory-path" title=""></span>
      <button id="choose-directory" type="button" class="secondary">Changer de dossier</button>
      <button id="sync-database" type="button" class="secondary sync-button"
              title="Mettre à jour photos.db pour le dossier courant (personnes, mots-clés, taxons, lieux)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c-4.4 0-8 1.3-8 3v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6c0-1.7-3.6-3-8-3zm0 2c3.6 0 6 .8 6 1s-2.4 1-6 1-6-.8-6-1 2.4-1 6-1zm6 13c0 .2-2.4 1-6 1s-6-.8-6-1v-2.2c1.5.7 3.7 1.2 6 1.2s4.5-.5 6-1.2V18zm0-5c0 .2-2.4 1-6 1s-6-.8-6-1v-2.2c1.5.7 3.7 1.2 6 1.2s4.5-.5 6-1.2V13z"/></svg>
        <span>photos.db</span>
      </button>
      <button id="open-external" type="button" class="ghost" title="Ouvrir l’application active dans un onglet">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7h-2V6.4l-8.3 8.3-1.4-1.4L17.6 5H14V3zM5 5h6v2H7v10h10v-4h2v6H5V5z"/></svg>
      </button>
    </div>
  </header>

  <main class="frames">
    <div id="frames-host" class="frames-host"></div>

    <div id="frame-status" class="frame-status" hidden>
      <div class="status-card">
        <div id="status-spinner" class="spinner" aria-hidden="true"></div>
        <p id="status-text">Démarrage…</p>
        <div id="status-error" class="status-error" hidden>
          <p id="status-error-message"></p>
          <div class="status-actions">
            <button id="restart-app" type="button">Relancer l’application</button>
            <button id="show-log" type="button" class="secondary">Voir le journal</button>
          </div>
          <pre id="status-log" class="status-log" hidden></pre>
        </div>
      </div>
    </div>
  </main>

  <div id="notice" class="notice" role="status" hidden></div>
</body>
</html>
