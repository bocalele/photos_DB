<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>if (new URLSearchParams(location.search).has("embed")) document.documentElement.classList.add("embedded");</script>
  <title>Faune</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="workspace">
    <header class="gallery-header">
      <div>
        <h1>Faune</h1>
        <p id="photo-count">Chargement des photos…</p>
        <p id="directory-path" class="directory-path"></p>
      </div>
      <div class="gallery-header-actions">
        <label class="thumbnail-size" for="thumbnail-size">
          Taille des vignettes
          <input id="thumbnail-size" type="range" min="90" max="280" value="170">
        </label>
        <button id="change-directory" type="button" class="secondary">Changer de dossier</button>
        <button id="exit-app" type="button" class="secondary exit-button"
                title="Quitter et arrêter le serveur">Quitter</button>
      </div>
    </header>
    <nav class="gallery-tools" aria-label="Actions sur les photos">
      <button id="select-all" type="button">Tout sélectionner</button>
      <button id="deselect-photos" type="button" disabled>Désélectionner</button>
      <button id="classify-photos" class="primary" type="button" disabled>
        Classer les photos sélectionnées
      </button>
      <button id="clear-fauna" type="button" class="danger" disabled>
        Supprimer les données Faune
      </button>
    </nav>
    <section id="classification-progress" class="classification-progress" hidden>
      <progress id="progress-bar" max="100" value="0"></progress>
      <span id="progress-status" role="status"></span>
      <ul id="classification-errors"></ul>
    </section>
    <section id="photo-grid" aria-live="polite"></section>
  </main>

  <div id="class-overlay" class="class-overlay" hidden>
    <div class="class-dialog" role="dialog" aria-modal="true" aria-labelledby="class-title">
      <h2 id="class-title">Rattacher ce taxon à une classe</h2>
      <p>
        <strong id="class-taxon-name"></strong> n’est présent ni dans TAXREF ni
        dans les thésaurus. Choisissez la classe à laquelle le rattacher.
      </p>
      <label class="control-label" for="class-select">Classe</label>
      <select id="class-select"></select>
      <p id="class-error" class="class-error" hidden></p>
      <div class="class-actions">
        <button id="class-cancel" type="button" class="secondary">Annuler</button>
        <button id="class-confirm" type="button" class="primary">Rattacher</button>
      </div>
    </div>
  </div>
</body>
</html>
